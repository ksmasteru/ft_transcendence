server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # SPA fallback, mirrors devServer.historyApiFallback in webpack.config.js
        try_files $uri $uri/ /index.html;
    }
}
